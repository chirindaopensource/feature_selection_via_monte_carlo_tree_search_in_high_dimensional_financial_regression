      - {name: "Rate_of_Change", parameters: [5, 10, 21, 63], count: 4}
      - {name: "Momentum", parameters: [5, 10, 21, 63], count: 4}
      - {name: "SMA", parameters: [5, 10, 20, 50, 100, 200], count: 6}
