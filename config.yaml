  level1_patience_value_endogenous: 63  # [S] Table 2
  rollout_loop_condition: "a_stop not selected AND |s| < K_max"  # [S]
  rollout_steps:
    - "compute beta (Eqs. 7, 8, 9)"  # [S]
    - "sample a ~ pi(a|s) (Eq. 1)"  # [S]
    - "update s <- s union {a}"  # [S]
  rollout_return: "terminal subset s and EvaluateState(s, X_train, Y_train)"  # [S]
  runtime_gap_attribution: "most additional runtime from patience P, not stop mechanism"  # [S]
