  # Ridge, Lasso and Elastic Net therefore fit on features AND target standardised
  # with the mean and population standard deviation of the Lasso training window
  # (lasso_L1.training_window_days rows), applied unchanged to the test rows (no
  # test-period statistic is used; expanding / rolling causal scalers give the same
  # R^2 to within 0.03). Predictions and coefficients are reported in raw units.
