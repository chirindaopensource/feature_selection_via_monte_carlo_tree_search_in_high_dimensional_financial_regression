algorithm_1_controller:
  alg_number: 1  # [S]
  caption: "GNRPA with Endogenous Stopping"  # [S]
  functions_in_block: ["GNRPA(L, s, W)", "Rollout(s, W)"]  # [S]
  n_functions: 2  # [S]
  unexpanded_subroutines: ["ComputeHeuristics", "EvaluateState"]  # [S]
  n_unexpanded_subroutines: 2  # [S]
  requires: ["Level L", "State s", "Policy W", "Max Iters I_L", "Patience P"]  # [S]
  recursion_depth_actual: 3  # [S] Table 2 triples
  recursion_termination_L0: "call Rollout(s, W)"  # [S]
  best_score_initial_value: "(-inf, -inf, -inf)"  # [S]
  best_seq_initial_value: "empty"  # [S]
  no_improve_counter_initial_value: 0  # [S]
  iteration_counter_initial_value: 0  # [S]
  termination_rule_L1: "break if no_improve >= P and L == 1"  # [S]
