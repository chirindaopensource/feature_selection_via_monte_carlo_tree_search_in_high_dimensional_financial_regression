# ==============================================================================
# SECTION 3 — FEATURE GENERATION POLICY (REVISED: ADDED TO RESOLVE CRITICAL
#             DEFICIENCY C_feat — the feature-constructibility defect)
# ==============================================================================
# The manuscript states p = 1,072 but does NOT enumerate the technical-indicator
# inventory, the specific interaction-term list, the specific squared-transform
# list, or the source-operator assignment rules. The block below is a principled
# reconstruction that reconciles to p = 1,072. Every parameter is a placeholder
# awaiting confirmation. The reconciliation is stated explicitly so an auditor
# can verify the arithmetic.
# ==============================================================================
feature_generation_policy:
  base_series:  # [I] union of §3.1 families; [S] 17 = 4 + 7 + 6
    market: ["ndx_close", "ndx_volume", "vix_close", "usd_index_close"]
    macro: ["rate_short", "rate_long", "spread_2s10s", "spread_hy", "inflation_cpi", "labor_unrate", "labor_payems"]
    factor: ["MKT", "SMB", "HML", "RMW", "CMA", "MOM"]
    n_base_series: 17
  rolling_windows_W: [5, 21, 63, 126, 252]  # [S] §3.1
  lag_offsets: [1, 2, 3, 5]  # [S] §3.1
  leakage_lookback_threshold_days: 5  # [S] §3.1
  # [U] DEVIATION, approved 2026-10-22. The §3.1 lookback rule cannot exclude
  # overlap with the target window W_t = {t-4, ..., t}: every causal window
  # ending at t contains r_t (ROC_5 at t reproduces Y_t; the 2026-10-22 smoke
  # search reached validation R^2 = 0.9994). Every NDX base series is lagged by
  # h = eq3_target_and_partition.aggregation_window sessions BEFORE feature
  # construction, so NDX-derived features are F_{t-h}-measurable; exogenous
  # series stay contemporaneous (§3.1). The lookback rule above is kept.
  # [U] DEVIATION, approved 2026-10-22 (second). The market factor MKT is lagged
  # by h as well: MKT__mean__5 / MKT__sum__5 at t span W_t and correlate 0.92
  # (train) / 0.95 (test) with Y_t, giving OOS R^2 0.88 alone. No MKT term is in
  # Table 4, and the paper's greedy L0 baseline (0.2489) could not have missed
  # it, so the paper's pool cannot have held a contemporaneous MKT aggregate.
  # SMB, HML, RMW, CMA and MOM stay contemporaneous (Table 4 keeps CMA_t, HML_t).
  target_window_information_barrier:
    enabled: true
    horizon_source: "eq3_target_and_partition.aggregation_window"
    lagged_columns: ["ndx_close", "ndx_volume", "MKT"]  # base series lagged by h
    price_columns: ["ndx_close"]  # perturbed by the window audit
    return_columns: ["MKT"]  # per-session returns; audited by a one-session shock
    audit:
      n_probes: 3  # probe sessions in the pre-split domain
      probe_epsilon: 0.001  # relative price shock that changes one r_s
      lineage_noise: 0.05  # noise that classifies NDX dependence
      change_tolerance: 1.0e-09  # relative change threshold
      holdout_fraction: 0.3  # sentinel chronological holdout share
      max_reconstruction_r2: 0.1  # sentinel ceiling (tripwire, not a theorem)
      ridge_lambda: 1.0e-05  # Eq. (6) stabiliser on the per-row Gram
      seed: 20261022
  operator_application_matrix:
    # For every base series, apply each operator family. Column below states
    # the count contributed per series. [U] UNSPECIFIED IN MANUSCRIPT.
    level_raw: 1  # [U] operator-source assignment; UNSPECIFIED IN MANUSCRIPT
    first_difference: 1  # [S] §3.1
    rolling_mean_W: 5  # [S] five windows
    rolling_std_W: 5  # [S] five windows
    rolling_sum_W: 5  # [S] five windows
    lagged_level_offsets: 4  # [S] four offsets {1,2,3,5}
    lagged_first_difference_offsets: 4  # [S] four offsets {1,2,3,5}
    per_series_subtotal: 25  # [I] arithmetic
  per_series_features_total: "17 * 25 = 425"  # [I] arithmetic
  rolling_operator_std_convention: "sample"  # [U] UNSPECIFIED IN MANUSCRIPT — placeholder: sample std (ddof=1)
  rolling_operator_min_periods_policy: "full_window"  # [U] UNSPECIFIED IN MANUSCRIPT — placeholder: burn-in NaN, do not partial-window
  additional_transforms:
    # Counts below are the reconstruction totals. Every count is [U]/[I].
    squared_levels_on_volatility_series: {count: 1, rationale: "e.g. VIX_t^2 explicitly named in §3.1 and confirmed in Table 4"}  # [S] example named; [U] full inventory
    squared_first_diffs_on_volatility: {count: 1, rationale: "e.g. (Delta VIX_t)^2"}  # [U] UNSPECIFIED IN MANUSCRIPT
    squared_levels_on_market_series: {count: 1, rationale: "e.g. NDX level squared"}  # [U] UNSPECIFIED IN MANUSCRIPT
    cross_family_interactions_VIX_macro: {count: 7, rationale: "VIX x each of the 7 macro series"}  # [U] UNSPECIFIED IN MANUSCRIPT
    cross_family_interactions_VIX_factor: {count: 6, rationale: "VIX x each of the 6 factor series"}  # [U] UNSPECIFIED IN MANUSCRIPT
    factor_pair_interactions: {count: 15, rationale: "6 choose 2 = 15 pairs"}  # [U] UNSPECIFIED IN MANUSCRIPT
    rolling_mean_of_first_difference_W_5_21_63: {count: "17 * 3 = 51", rationale: "rolling mean of the first difference at W in {5,21,63}"}  # [U] UNSPECIFIED IN MANUSCRIPT
    rolling_std_of_first_difference_W_5_21_63: {count: "17 * 3 = 51", rationale: "rolling std of the first difference at W in {5,21,63}"}  # [U] UNSPECIFIED IN MANUSCRIPT
    subtotal: "1 + 1 + 1 + 7 + 6 + 15 + 51 + 51 = 133"  # [I] arithmetic
  technical_indicator_inventory:
    # [U] UNSPECIFIED IN MANUSCRIPT — the paper states "technical indicators
    # derived from the NASDAQ-100 with lookback periods shorter than five
    # trading days were excluded" but does not name the indicators.
    # The inventory below is a principled placeholder sized to close the
