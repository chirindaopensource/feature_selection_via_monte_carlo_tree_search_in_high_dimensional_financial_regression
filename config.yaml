# ==============================================================================
# SECTION 5 — EQUATION-BY-EQUATION CONTRACTS
# ==============================================================================
eq1_policy:
  eq_number: 1  # [S]
  equation_form: "pi(a_k | s) = exp(w_{s,a_k}/tau + beta_{s,a_k}) / sum_j exp(w_{s,a_j}/tau + beta_{s,a_j})"  # [S]
  policy_weight_symbol: "W"  # [S]
  policy_matrix_size: [1072, 1072]  # [S] §3.2
  policy_matrix_entries_total: 1149184  # [I] 1,148,384
  policy_matrix_data_type: "float64"  # [U] UNSPECIFIED IN MANUSCRIPT — placeholder
  policy_initialization: "zero_uniform"  # [U] UNSPECIFIED IN MANUSCRIPT — intelligent placeholder: W_0 = 0 for all entries
  policy_initialization_alternatives: ["zero_uniform", "random_normal_sigma_0_01", "random_normal_sigma_0_1"]  # [U] UNSPECIFIED IN MANUSCRIPT
  temperature_symbol: "tau"  # [S]
  temperature_value_fixed: 1.52  # [S] Table 2
  temperature_value_tuned: 0.868  # [S] Table 2
  temperature_value_endogenous: 1.515  # [S] Table 2
  parameter_identification_note: "beta_mag and tau identified only up to their ratio through the learned channel"  # [I]
  action_masking_applied: true  # [S] Eq. (5)
  sampling_mechanism: "single_categorical_draw"  # [S] Alg. 1 Rollout line 2
  sampling_label_in_paper: "Gibbs Sampling Selection"  # [S] Fig. 1
  terminology_caveat: "mechanically a single categorical draw from a softmax distribution, NOT MCMC Gibbs"  # [I]
  reference_keys: ["cazenave2020generalized", "rosin2011nested", "cazenave2017nested"]  # [S]
eq2_adaptation:
  eq_number: 2  # [S]
  equation_form: "w_{s,a_j} <- w_{s,a_j} - (alpha/tau) * (pi(a_j|s) - I{a_j = a*})"  # [S]
  update_target_symbol: "a*"  # [S]
  update_target_semantic: "action taken in the best rollout sequence retained at this level"  # [S]
  effective_step_size: "alpha/tau"  # [S]
  step_direction_for_best_action: "increase w"  # [I]
  step_direction_for_other_actions: "decrease w"  # [I]
  alpha_L1_value_endogenous: 0.177  # [S] Table 2
  alpha_L1_value_fixed: 1.514  # [S] Table 2 (global; alpha_L1 == alpha_high)
  alpha_L1_value_tuned: 2.003  # [S] Table 2 (global)
  alpha_high_value_endogenous: 2.212  # [S] Table 2
  alpha_routing_rule: "alpha = alpha_L1 if L == 1 else alpha_high"  # [S] Alg. 1
  uses_value_function: false  # [I]
  uses_advantage_estimate: false  # [I]
  uses_temporal_difference: false  # [I]
  uses_bootstrapping: false  # [I]
  update_type: "policy-gradient-style softmax update with one-hot target"  # [I]
eq3_target_and_partition:
  eq_number: 3  # [S]
  equation_form: "Y_t = sum_{k=0}^{4} r_{t-k};  r_t = (P_t - P_{t-1}) / P_{t-1}"  # [S]
  return_operator: "simple_arithmetic_return_not_log"  # [S]
  aggregation_window: 5  # [S]
  burn_in_rows: 4  # [I]
  span_start: "2000-01-01"  # [S] §3.1
  span_end: "2026-03-31"  # [S] §3.1
  observation_count_T: 6260  # [S]
  n_features_p: 1072  # [S]
  rolling_lookback_windows_W: [5, 21, 63, 126, 252]  # [S]
  leakage_exclusion_lookback_threshold: 5  # [S]
  leakage_exclusion_scope: "technical indicators derived from the NASDAQ-100"  # [S]
  split_date: "2023-12-31"  # [S]
  train_window_fixed_days: 1890  # [S] §4.1, Table 2
  train_window_tuned_days: 1890  # [S] §4.1, Table 2
  train_window_endogenous_days: 1000  # [S] §4.1, §4.3
  internal_validation_window_days: 562  # [S] §4.1
  test_window_days: 562  # [S] §4.1
  test_window_calendar_span: ["2024-01-02", "2026-03-31"]  # [S]
  validation_positioning: "immediately_preceding_test_window"  # [S]
  outer_walk_forward_folds: 3  # [S] §4.1
  outer_walk_forward_overlap: 0  # [S]
  outer_walk_forward_data_scope: "pre_2024_only"  # [S]
  outer_walk_forward_fold_boundaries: null  # [U] UNSPECIFIED IN MANUSCRIPT — placeholder: contiguous non-overlapping equal-count folds
  R2_convention: "1 - SSD_resid / SSD_total(evaluation_sample_variance)"  # [S]
  # [REVISED] Test-window data availability.
  test_window_data_availability: "post_2026-03-31_vintage_required"  # [U] UNSPECIFIED IN MANUSCRIPT — the OOS evaluation is calendar-blocked until 2026-03-31
eq4_objective:
  eq_number: 4  # [S]
  equation_form: "min_theta (1/(2*N_train)) ||Y_train - X_{train,S} theta||_2^2  s.t. ||theta||_0 <= K"  # [S]
  residual_norm_order: 2  # [S]
  cardinality_norm_order: 0  # [S]
  scale_denominator: "2 * N_train"  # [S]
  K_upper_bound: 60  # [S] §3.3 — K_max
  N_train_value_fixed_tuned: 1890  # [S]
  N_train_value_endogenous: 1000  # [S]
  evaluation_dataset: "validation_set"  # [S] §3.2
  search_space_full_size:   # [S]
  search_modes: ["fixed_cardinality", "adaptive_endogenous"]  # [S]
eq5_mdp:
  eq_number: 5  # [S]
  equation_form: "A(s_t) = (F \\ S_t) union {a_stop}"  # [S]
  mdp_tuple: "(S, A, R)"  # [S]
  feature_universe_symbol: "F"  # [S]
  feature_universe_size: 1072  # [S]
  state_definition: "(f_last, S_t)"  # [S]
  initial_state: "(f_last=None, S_0=set())"  # [S]
  state_space_nominal: "p * 2^p"  # [I]
  state_space_factored: "p^2 + p"  # [I]
  action_types: ["add_feature", "stop"]  # [S]
  stop_action_symbol: "a_stop"  # [S]
  transition: "S_{t+1} = S_t union {a}; f_last <- a"  # [S]
  transition_monotonicity: "support_non_decreasing_no_removal_no_swap"  # [I]
  terminal_conditions: ["a_stop_selected", "cardinality_equals_K_max"]  # [S]
  reward_timing: "terminal_only"  # [S]
  reward_is_delayed: true  # [S]
  reward_is_discounted: false  # [S]
  reward_is_summed: false  # [S]
eq6_fit:
  eq_number: 6  # [S]
  equation_form: "theta_hat_S = (X_{train,S}^T X_{train,S} + lambda I)^{-1} X_{train,S}^T Y_train"  # [S]
  estimator_type: "ridge_stabilized_OLS"  # [S]
  shrinkage_applied: false  # [S] §3.2, §4.4
  stabilizer_symbol: "lambda"  # [S]
  stabilizer_value: 1.0e-05  # [S] §3.2
  stabilizer_role: "numerical stability only"  # [S]
  linear_algebra_backend: "NumPy"  # [S]
  # [REVISED] Gram-matrix inversion method resolution.
  gram_matrix_inversion_method: "np.linalg.solve_gram_with_I"  # [U] UNSPECIFIED IN MANUSCRIPT — placeholder: solve (X^T X + lambda I) theta = X^T Y rather than explicit inverse
  gram_matrix_fallback: "np.linalg.pinv"  # [U] UNSPECIFIED IN MANUSCRIPT — placeholder for near-singular fallback
  fit_dataset: "train_block"  # [S]
  score_dataset: "internal_validation_562_days"  # [S]
  final_eval_dataset: "test_block_562_days"  # [S]
eq7_redundancy:
  eq_number: 7  # [S]
  equation_form: "Red_{top-k-rms}(f_i,S) = ((1/min(k,|S|)) * sum_{m=1..min(k,|S|)} c_(m)^2)^{1/2}"  # [S]
  correlation_type: "sample_Pearson"  # [S]
  relevance_formula: "Rel(f_i) = |rho(f_i, Y)|"  # [S]
  redundancy_pool_formula: "C_{i,S} = {|rho(f_i, f_j)| : f_j in S}"  # [S]
  order_statistic_definition: "c_(m) = m-th largest element of C_{i,S}"  # [S]
  k_endogenous: 3  # [S] §3.4
  metric_settings: ["mean", "rms", "top-3-rms"]  # [S]
  metric_assignment_fixed: "mean"  # [S] Table 2
  metric_assignment_tuned: "rms"  # [S] Table 2
  metric_assignment_endogenous: "top-3-rms"  # [S] Table 2
  variant_mean_formula: "Red_mean(f_i,S) = (1/|S|) * sum_{m=1..|S|} c_(m)^2"  # [S] §3.3 prose
  variant_rms_formula: "Red_rms(f_i,S) = ((1/|S|) * sum_{m=1..|S|} c_(m)^2)^{1/2}"  # [S] §3.3 prose
  # [REVISED] Correlation-estimation window resolution (previously absent).
  correlation_estimation_window: "train_window_full_1890_or_1000_days_by_config"  # [U] UNSPECIFIED IN MANUSCRIPT — placeholder: use full training window per configuration
  correlation_estimation_window_alternatives: ["train_window_full", "expanding_from_train_start", "rolling_252_days"]  # [U] UNSPECIFIED IN MANUSCRIPT
eq8_feature_bias:
  eq_number: 8  # [S]
  equation_form: "beta(f_i|S) = beta_mag * [gamma * Rel(f_i) - (1-gamma) * Red_{top-k-rms}(f_i,S)]"  # [S]
  gamma_domain: [0.0, 1.0]  # [S]
  gamma_value_fixed: 0.666  # [S] Table 2
  gamma_value_tuned: 0.772  # [S] Table 2
  gamma_value_endogenous: 0.811  # [S] Table 2
  beta_mag_value_fixed: 24.82  # [S] Table 2
  beta_mag_value_tuned: 14.97  # [S] Table 2
  beta_mag_value_endogenous: 13.72  # [S] Table 2
eq9_stop_gravity:
  eq_number: 9  # [S]
  equation_form_cases:
    - "beta(a_stop|S) = -inf if |S| < K_min"  # [S]
    - "beta(a_stop|S) = beta_mag * gamma * beta_stop * ((|S|-K_min)/max(1,K_max-|S|))^{3/2} if |S| >= K_min"  # [S]
  K_min_symbol: "K_min"  # [S]
  # [REVISED] K_min resolution (previously None).
  K_min_value: 5  # [U] UNSPECIFIED IN MANUSCRIPT — intelligent placeholder: 5 (candidate set was {1,5,10,15}; 5 permits early-stage exploration while protecting against trivially small subsets)
  K_min_resolution_rationale: "Chosen as the lower bound of the candidate set most consistent with the endogenous mean size 18.6 and tuned target 15."  # [U] UNSPECIFIED IN MANUSCRIPT
  K_max_symbol: "K_max"  # [S]
  K_max_value: 60  # [S] §3.3
  exponent_value: 1.5  # [S] "3/2"
  exponent_rationale: "empirically chosen constant per paper"  # [S]
  beta_stop_value_endogenous: 0.909  # [S] Table 2
  beta_stop_value_fixed: null  # [S] Table 2 shows "--"
  beta_stop_value_tuned: null  # [S] Table 2 shows "--"
  convexity_property: "bias grows convexly as |S| approaches K_max"  # [I]
  # [REVISED] Fixed-cardinality enforcement mechanism resolution (previously None).
  fixed_cardinality_enforcement_mechanism: "hard_mask_stop_until_cardinality_equals_K"  # [U] UNSPECIFIED IN MANUSCRIPT — placeholder
  fixed_cardinality_enforcement_description: "For fixed and tuned configurations, set beta(a_stop|S) = -inf until |S| = K, then set beta(a_stop|S) = 0; equivalently K_min = K_max = K."  # [U] UNSPECIFIED IN MANUSCRIPT
eq10_reward:
  eq_number: 10  # [S]
  equation_form: "R(S) = (round(R2_val(S), 3), -|S|, -MaxVIF(S))"  # [S]
  primary_key: "rounded_validation_R2"  # [S]
  primary_key_rounding_places: 3  # [S]
  # [REVISED] Rounding operator semantic correction.
  primary_key_rounding_operator: "round_half_away_from_zero"  # [S] - notation Floor[x]_3 in the manuscript denotes rounding-to-3dp, NOT truncation
  secondary_key: "-|S|"  # [S]
  secondary_key_semantic: "prefer smaller subsets among ties"  # [S]
  tertiary_key: "-MaxVIF(S)"  # [S]
  tertiary_key_semantic: "prefer lower internal multicollinearity among residual ties"  # [S]
  comparison_operator: "lexicographic_strict_greater_than"  # [S] Alg. 1
  quantization_note: "3-decimal rounding manufactures ties that activate the lower keys"  # [I]
  reward_scalarization_active: false  # [S]
eq11_maxvif:
  eq_number: 11  # [S]
  equation_form: "MaxVIF(S) = max_{j in [1..|S|]} (C_S^{-1})_{jj}"  # [S]
  correlation_matrix_symbol: "C_S"  # [S]
  correlation_matrix_shape: "(|S|, |S|)"  # [S]
  role: "tie_breaker_inside_lexicographic_reward"  # [S]
  correlation_matrix_fit_on: "validation_subset"  # [U] UNSPECIFIED IN MANUSCRIPT — placeholder: validation; matches the reconstruction from the manuscript's presentation of Eq. 11
  # [REVISED] Singular handling resolution (previously None).
  singular_handling: "moore_penrose_pseudoinverse"  # [U] UNSPECIFIED IN MANUSCRIPT — placeholder
  singular_handling_rationale: "Under severe collinearity the correlation matrix may be rank-deficient; Moore-Penrose pseudoinverse preserves the MaxVIF diagnostic's continuity and avoids subset rejection."
  reference_key: "belsley1980regression"  # [S]
eq12_ensemble:
  eq_number: 12  # [S] — displayed; not referenced by number in the manuscript's running text
  equation_form: "y_hat_ens = (1/M) * sum_m X theta_hat^(m) = X * theta*"  # [S]
  M_value_fixed: 18  # [S] Table 3
  M_value_tuned: 18  # [S] Table 3
  M_value_endogenous: 12  # [S] Table 3
  aggregation_mode: "soft_voting_mean_of_coefficient_vectors"  # [S]
  batch_size: 6  # [S] §4.3
  batch_count_fixed: 3  # [I] 18/6
  batch_count_tuned: 3  # [I] 18/6
  batch_count_endogenous: 2  # [I] 12/6
  stabilization_threshold: 0.01  # [S] §4.3
  stabilization_window: "two_consecutive_batches"  # [S] §4.3
  closure_property: "affine_combination_of_affine_maps_is_affine"  # [S]
  preserves_linear_attribution: true  # [S]
  refit_after_averaging: false  # [S]
  # [REVISED] Soft-voting zero-embedding procedure resolution (previously None).
  implicit_zero_embedding_required: true  # [I]
  zero_embedding_procedure: "Construct a length-p=1072 real vector per run m, with entries from theta_hat^(m) at selected feature indices and 0 elsewhere; average the p-length vectors elementwise to obtain theta* in R^p."  # [U] UNSPECIFIED IN MANUSCRIPT — placeholder
  support_of_theta_star: "union of S^(m) over m"  # [S] §4.4
  contrast_to_tree_ensembles: "tree-based ensembles are not closed under averaging"  # [S]
  # [REVISED] Redraw hyperparameters per run, previously ambiguous.
  hyperparameters_fixed_across_runs: true  # [U] UNSPECIFIED IN MANUSCRIPT — placeholder: same Table 2 hyperparameter vector per run; only the sampling seed varies
  hyperparameters_redraw_policy: "fixed_per_configuration"  # [U] UNSPECIFIED IN MANUSCRIPT
  seeds_per_run_distinct: true  # [U] UNSPECIFIED IN MANUSCRIPT — placeholder: distinct seed per run
  seed_management_convention: "one_run_seed_seeds_all_stochastic_loci_within_run"  # [U] UNSPECIFIED IN MANUSCRIPT
