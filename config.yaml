    lookback_minimum_days: 5  # [S] §3.1 leakage rule
    indicators:
      - {name: "RSI", parameters: [6, 7, 9, 14, 21, 28], count: 6}
      - {name: "Stochastic_%K_%D", parameters: [[5, 3], [9, 3], [14, 3], [21, 3], [28, 3]], count: 10}
