# ==============================================================================
# SECTION 14 — METHODOLOGICAL NOTES AND DOCUMENTED GAPS
# ==============================================================================
methodological_notes:
  note_1: "The study is EXPLANATORY, not FORECASTING. Do not relabel R^2 as predictive."  # [S]
  note_2: "Exogenous variables are contemporaneously aligned, not lagged — deliberate."  # [S]
  note_3: "No shrinkage is applied beyond the numerical stabilizer lambda = 1e-5."  # [S]
  note_4: "The reward is a tuple compared lexicographically; do NOT scalarize."  # [S]
  note_5: "The 3-decimal rounding is load-bearing: it manufactures ties so sparsity and MaxVIF matter."  # [I]
  note_6: "MaxVIF is a TIE-BREAKER, not an additive penalty."  # [S]
  note_7: "Endogenous stopping is implemented entirely as a bias on a_stop."  # [S]
  note_8: "The policy is TABULAR (p x p), not a neural-network function approximator."  # [S]
  note_9: "Eq. (2) is a policy-gradient-style softmax update with one-hot target; no value function, no bootstrapping, no TD error."  # [I]
  note_10: "Ensemble aggregation is linear-coefficient averaging; the average of linear maps is linear (Eq. 12)."  # [S]
  note_11: "Iteration budgets were scaled based on empirical convergence during preliminary tuning."  # [S]
  note_12: "Most additional runtime for the endogenous configuration comes from level-1 patience P, not the stopping mechanism."  # [S]
  note_13: "CV-to-test gap is the optimizer's curse, not leakage."  # [S]
  note_14: "The exemplar 15-feature run is a post-hoc best draw; the ensemble average is the headline metric."  # [S]
